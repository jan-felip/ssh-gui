# Copy to servers.yaml and fill in real values:
#   cp servers.example.yaml servers.yaml
#   chmod 600 servers.yaml
#
# Or add hosts from the TUI: select "[+] Add host" at the bottom of the menu.
# Press → on a host for deploy actions (web paths, git pull, rsync).
#
# Fields:
#   host        (required) IP or hostname
#   user        (required) SSH username
#   pass        (optional) password — prefer identity when possible
#   port        (optional) SSH port, default 22
#   identity    (optional) private key path (~/.ssh/id_ed25519)
#   notes       (optional) short label shown in the menu
#   web_remote  (optional) remote web/app path (e.g. /var/www/app)
#   web_local   (optional) local project directory to rsync from
#   git_user    (optional) username for private HTTPS git pull on remote
#   git_token   (optional) token/password for git — NEVER commit real tokens
#   remi_php    (optional) cached Remi version from Vendor Drush, e.g. php83

example_lab:
  host: 192.0.2.10
  user: deploy
  pass: "change-me"
  port: 22
  notes: "Example with password (DOCUMENTATION — not a real server)"
  web_remote: /var/www/example
  web_local: ~/Projects/example
  # git_user: deploy
  # git_token: "replace-me"

example_with_key:
  host: 192.0.2.20
  user: admin
  identity: ~/.ssh/id_ed25519
  port: 22
  notes: "Example with SSH key"

